<div class="flex flex-col">
  <p>Horas Cubiertas:</p>
  <div class="flex flex-row gap-2">
    @for (meterItem of metresToShow; track meterItem.label) {
      <div class="w-40 border border-surface-100 rounded-lg p-2" [ngClass]="{'!border-red-500': meterItem.exceeded}">
        <div class="flex justify-between gap-4 items-center">
          <div class="flex flex-col gap-1">
            @if (meterItem.exceeded){
              <span class="text-red-600 text-sm">{{ meterItem.label }}</span>
              <span class="font-bold text-base text-red-600">
                {{ (meterItem.value * 100) / meterItem.max | number:'1.0-0' }}%
              </span>
            } @else {
              <span class="text-surface-500 text-sm">{{ meterItem.label }}</span>
              <span class="font-bold text-base">
                {{ (meterItem.value * 100) / meterItem.max | number:'1.0-0' }}%
              </span>
            }
          </div>
          <span
            class="w-7 h-7 rounded-full inline-flex justify-center items-center text-center"
            [style]="{ 'background-color': meterItem.color, color: '#ffffff' }"
          >
          <i [class]="meterItem.icon"></i>
        </span>
        </div>
      </div>
    }
  </div>
</div>
