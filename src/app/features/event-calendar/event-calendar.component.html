<div>
  <div class="max-w-7xl mx-auto">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Mi Calendario de Formación</h1>
        <p class="text-gray-600 mt-1">Consulta los próximos eventos de la ECATLIM.</p>
      </div>

      <div class="flex flex-wrap gap-4 bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-blue-500"></span>
          <span class="text-xs font-medium text-gray-700">Acogida al scouter</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-purple-600"></span>
          <span class="text-xs font-medium text-gray-700">Educador/a Scout</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-ecatlim"></span>
          <span class="text-xs font-medium text-gray-700">Coordinador/a Scout</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-green-600"></span>
          <span class="text-xs font-medium text-gray-700">Cursos</span>
        </div>
      </div>
    </div>

    <div class="mt-2 mb-4 flex items-center justify-end gap-2 text-gray-500 text-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Haz clic en cualquier evento para ver los detalles e inscribirte.</span>
    </div>

    <div class="bg-white p-2 md:p-4 rounded-2xl shadow-xl border border-gray-200">
      <div class="calendar-container">
        <full-calendar [options]="calendarOptions"></full-calendar>
      </div>
    </div>
  </div>
</div>
