<div class="bg-white p-6 rounded-2xl shadow-sm border border-[#EBE5DC] space-y-4">

  <div class="flex items-center gap-2 text-[#3D2E24]">
    <i class="pi pi-folder text-[#795221]"></i>
    <h3 class="text-sm font-bold">Documentación y Archivos</h3>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <div class="p-4 rounded-xl border border-[#EBE5DC] bg-[#FAF8F5] flex flex-col justify-between h-28">
      <div class="flex justify-between items-start">
        <div class="flex items-center gap-2">
          <i class="pi pi-file-edit text-[#795221] text-sm"></i>
          <span class="text-xs font-bold text-[#3D2E24]">Plan Personal de Formación</span>
        </div>

        <span
          class="text-[9px] font-black uppercase px-2 py-0.5 rounded"
          [ngClass]="planUploaded() ? 'bg-emerald-100 text-emerald-800' : 'bg-[#F3E3C3] text-[#795221]'"
        >
          {{ planUploaded() ? 'Entregado' : 'Pendiente' }}
        </span>
      </div>

      <input
        #fileInput
        type="file"
        class="hidden"
        (change)="onFileSelected($event)"
        accept=".pdf,.doc,.docx"
      />

      <div class="flex gap-2">
        <a
          href="../../../../assets/templates/plan_personal_formacion_es.docx"
          download="Plan_Personal_Formacion_ECATLIM.docx"
          class="flex-1 py-1 text-xs font-bold border border-[#D9CFC4] bg-white text-[#5C4D42] rounded-lg hover:bg-gray-50 cursor-pointer flex items-center justify-center gap-1 no-underline"
          title="Descargar plantilla base"
        >
          <i class="pi pi-download text-[10px]"></i> Plantilla
        </a>

        @if (!planUploaded()) {
          <button
            (click)="fileInput.click()"
            class="flex-1 py-1 text-xs font-bold bg-[#633F17] text-white rounded-lg hover:bg-[#4D3112] border-0 cursor-pointer flex items-center justify-center gap-1"
          >
            <i class="pi pi-upload text-[10px]"></i> Subir
          </button>
        } @else {
          <a
            [href]="fileUrl()"
            target="_blank"
            class="flex-1 py-1 text-xs font-bold border border-[#D9CFC4] bg-white text-[#5C4D42] rounded-lg hover:bg-gray-50 cursor-pointer flex items-center justify-center gap-1 no-underline"
            title="Ver archivo actual en línea"
          >
            <i class="pi pi-eye text-[10px]"></i> Ver
          </a>

          <button
            (click)="fileInput.click()"
            class="py-1 px-2.5 text-xs font-bold bg-[#633F17] text-white rounded-lg hover:bg-[#4D3112] border-0 cursor-pointer flex items-center justify-center gap-1"
            title="Reemplazar archivo existente"
          >
            <i class="pi pi-refresh text-[10px]"></i> Sustituir
          </button>
        }
      </div>
    </div>

    <div class="p-4 rounded-xl border border-[#EBE5DC] bg-[#FAF8F5] flex flex-col justify-between h-28">
      <div class="flex justify-between items-start">
        <div class="flex items-center gap-2">
          <i class="pi pi-check-circle text-emerald-600 text-sm"></i>
          <span class="text-xs font-bold text-[#3D2E24]">Visto Bueno de la Entidad</span>
        </div>
        <span class="text-[9px] font-black uppercase bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded">
          Aprobado
        </span>
      </div>
      <button class="w-full py-1 text-xs font-bold border border-[#D9CFC4] bg-white text-[#5C4D42] rounded-lg hover:bg-gray-50 cursor-pointer">
        <i class="pi pi-eye text-[10px] mr-1"></i> Ver Archivo
      </button>
    </div>

  </div>
</div>
