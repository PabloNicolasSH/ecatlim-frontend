<div class="min-h-screen flex items-center justify-center">
  <div class="flex flex-col items-center">
    <div class="text-center">
      <img src="assets/logo.jpg" alt="Logo">
      <h1 class="mb-0"><b>Aula Virtual <br>ECATLIM</b></h1>
    </div>
    <p>¿No tienes una cuenta?
      <a routerLink="register"
         style="font-style: inherit;
                text-decoration-line: underline;"
      >Solicita una</a></p>
    <form (ngSubmit)="login()" [formGroup]="loginForm">
      <div class="flex flex-col items-center mt-6">
        <p-floatlabel variant="on" class="w-full">
          <input
            id="username"
            pInputText
            formControlName="username"
            type="text"
            class="w-full"
          />
          <label for="username">Correo Electrónico</label>
        </p-floatlabel>
        <p-floatlabel variant="on" class="mt-5 w-full">
          <p-password
            id="password"
            formControlName="password"
            [toggleMask]="true"
            [feedback]="false"
          ></p-password>
          <label for="password">Contraseña</label>
        </p-floatlabel>
        <div class="w-full flex justify-end">
          <a class="text-blue-500 text-sm mt-1">
            He olvidado mi contraseña
          </a>
        </div>
        <p-button
          class="mt-4"
          severity="primary"
          label="Iniciar Sesión"
          icon="pi pi-user"
          [loading]="loading"
          type="submit"
        ></p-button>
      </div>
    </form>
  </div>
</div>
<div class="ms-6 hashtags">
  <h2>#ECATLIM</h2>
  <h2>#ESCUELA CANARIA de ANIMACIÓN en el TIEMPO LIBRE INSIGNIA de MADERA</h2>
</div>
