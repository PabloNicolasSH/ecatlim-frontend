<div class="flex flex-col items-center h-full justify-center">
  <div class="text-center justify-center">
    <img src="assets/logo.jpeg" alt="Logo" class="mx-auto">
    <h1 class="font-bold">Aula Virtual</h1>
    <h1 class="font-semibold">ECATLIM</h1>
  </div>
  <p>¿No tienes una cuenta?
    <a routerLink="/solicitud-registro"
       style="font-style: inherit;
                text-decoration-line: underline;"
    >Solicita una</a></p>
  @if (!recoverPassword) {
    <form (ngSubmit)="login()" [formGroup]="loginForm">
      <div class="flex flex-col items-center mt-6 w-80 max-w-[90vw]">
        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <input
              id="username"
              pInputText
              formControlName="username"
              type="text"
              class="w-full"
            />
            <label for="username">Correo Electrónico</label>
          </p-floatlabel>
          <app-field-error [control]="loginForm.get('username')" />
        </div>
        <div class="mt-5 w-full">
          <p-floatlabel variant="on" class="w-full">
            <p-password
              id="password"
              formControlName="password"
              [toggleMask]="true"
              [feedback]="false"
              styleClass="w-full"
              inputStyleClass="w-full"
            ></p-password>
            <label for="password">Contraseña</label>
          </p-floatlabel>
          <app-field-error [control]="loginForm.get('password')" />
        </div>
        <div class="w-full flex justify-end">
          <a class="text-blue-500 text-sm mt-3" style="cursor:pointer" (click)="recoverPassword = true">
            He olvidado mi contraseña
          </a>
        </div>
        <p-button
          class="mt-4"
          severity="primary"
          label="Iniciar Sesión"
          icon="pi pi-user"
          [loading]="loading"
          type="submit"
        ></p-button>
      </div>
    </form>
  } @else {
    <form (ngSubmit)="sendRecoverEmail()" [formGroup]="recoverForm" class="flex flex-col items-center mt-3">
      <p>Introduce a continuación tu correo de acceso</p>
      <p>para enviarte una nueva contraseña.</p>
      <div class="w-full mt-6">
        <p-floatlabel variant="on" class="w-full">
          <input
            id="recover"
            pInputText
            type="text"
            class="w-full"
            formControlName="email"
          />
          <label for="recover">Correo Electrónico</label>
        </p-floatlabel>
        <app-field-error [control]="recoverForm.get('email')" />
      </div>
      <div class="w-full flex justify-end">
        <a class="text-blue-500 text-sm mt-3" style="cursor:pointer" (click)="recoverPassword = false">
          Volver a inicio de sesión
        </a>
      </div>
      <p-button
        class="mt-4"
        severity="primary"
        label="Enviar correo"
        icon="pi pi-send"
        [loading]="loading"
        type="submit"
      ></p-button>
    </form>
  }
</div>
