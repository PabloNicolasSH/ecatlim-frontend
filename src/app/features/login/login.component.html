<div class="flex flex-col items-center">
  <div class="text-center">
    <h1 class="mb-0"><b>Aula Virtual <br>ECATLIM</b></h1>
  </div>
  <p>¿No tienes una cuenta? <a href="register" style="font-style: inherit">Solicita una</a></p>
  <div class="flex flex-col gap-3 mt-6">
    <p-floatlabel variant="on">
      <input id="username" pInputText [(ngModel)]="email"/>
      <label for="username">Correo Electrónico</label>
    </p-floatlabel>
    <p-floatlabel variant="on" class="mt-2">
      <input id="password" pInputText [(ngModel)]="password"/>
      <label for="password">Contraseña</label>
    </p-floatlabel>
    <a class="text-end" style="font-size: small; color: dodgerblue"><b>He olvidado mi contraseña</b></a>
  </div>
  <p-button class="mt-4" severity="primary">Iniciar Sesión</p-button>
</div>
<div class="ms-6 hashtags" style="color: #7C9EC2">
  <h2>#ECATLIM</h2>
  <h2>#ESCUELA CANARIA de ANIMACIÓN en el TIEMPO LIBRE INSIGNIA de MADERA</h2>
</div>
