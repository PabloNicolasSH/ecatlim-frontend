<div class="min-h-screen">
  <div class="flex flex-row min-h-screen w-full items-center">
    <div class="flex flex-1 flex-col items-center">
      <div class="text-center justify-center">
        <img src="logo.jpeg" alt="Logo" class="mx-auto">
        <h1 class="font-bold">Aula Virtual</h1>
        <h1 class="font-semibold">ECATLIM</h1>
      </div>
      <p>¿No tienes una cuenta?
        <a routerLink="register"
           style="font-style: inherit;
                text-decoration-line: underline;"
        >Solicita una</a></p>
      <form (ngSubmit)="login()" [formGroup]="loginForm">
        <div class="flex flex-col items-center mt-6">
          <p-floatlabel variant="on" class="w-full">
            <input
              id="username"
              pInputText
              formControlName="username"
              type="text"
              class="w-full"
            />
            <label for="username">Correo Electrónico</label>
          </p-floatlabel>
          <p-floatlabel variant="on" class="mt-5 w-full">
            <p-password
              id="password"
              formControlName="password"
              [toggleMask]="true"
              [feedback]="false"
            ></p-password>
            <label for="password">Contraseña</label>
          </p-floatlabel>
          <div class="w-full flex justify-end">
            <a class="text-blue-500 text-sm mt-1">
              He olvidado mi contraseña
            </a>
          </div>
          <p-button
            class="mt-4"
            severity="primary"
            label="Iniciar Sesión"
            icon="pi pi-user"
            [loading]="loading"
            type="submit"
          ></p-button>
        </div>
      </form>
    </div>
    <div class="flex flex-col justify-between h-screen p-2 max-h-svh">
      <img alt="castores" src="login-elements/Castor.svg">
      <img alt="lobatos" src="login-elements/Huella.svg">
      <img alt="tropa" src="login-elements/Tropa.svg">
      <img alt="escultas" src="login-elements/Nudo.svg">
      <img alt="rovers" src="login-elements/Horquilla.svg">
      <img alt="flor de lis" src="login-elements/Flor de Lis.svg">
    </div>
  </div>
</div>
<div class="ms-6 hashtags">
  <h2>#ECATLIM</h2>
  <h2>#ESCUELA CANARIA de ANIMACIÓN en el TIEMPO LIBRE INSIGNIA de MADERA</h2>
</div>
