<div class="flex flex-col h-[85vh] bg-[var(--p-surface-50)] rounded-lg overflow-hidden border shadow-md">
  <div class="flex-1 overflow-y-auto p-4 space-y-2 ps-44 pe-44">
    <ul class="space-y-2">
      @for (message of messages; track $index) {
        <li class="flex" [ngClass]="{'justify-end': message.message_side !== 'from', 'justify-start': message.message_side === 'from'}">
          <div class="flex items-center gap-1" [ngClass]="{'flex-row-reverse': message.message_side !== 'from'}">
            <p-avatar [label]="userFirstLetter()" size="normal" shape="circle"></p-avatar>
            <div
              class="max-w-[70%] px-4 py-2 rounded-lg text-sm shadow"
              [ngClass]="{
                'bg-[var(--p-amber-100)] text-black': message.message_side === 'from',
                'bg-[var(--p-amber-400)] text-white': message.message_side !== 'from'
              }"
            >
              {{ message.message }}
            </div>
          </div>
        </li>
      }
    </ul>
  </div>

  <div class="flex items-center gap-2 p-3 border-t bg-white">
    <input
      class="flex-1 px-4 py-2 border rounded-full focus:outline-none "
      placeholder="Escribe un mensaje..."
      type="text"
      [(ngModel)]="newMessage"
      (keydown.enter)="send()"
    />
    <p-button icon="pi pi-send" class="rounded-full px-4" (onClick)="send()" rounded></p-button>
  </div>
</div>
