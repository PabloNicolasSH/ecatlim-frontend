<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [draggable]="false"
  [style]="{width: '50vw'}"
  appendTo="body"
  styleClass="max-w-4xl"
>
  <ng-template #header>
    <div class="inline-flex items-start gap-2">
      <span class="font-bold whitespace-nowrap text-lg text-gray-800">Mi Información Personal</span>
    </div>
  </ng-template>

  <form (ngSubmit)="onSubmit()" [formGroup]="form" class="mt-2 w-full box-border">
    <div class="flex flex-col w-full">

      <p class="text-ecatlim font-bold mb-3">Nombre y Apellidos</p>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <input
              id="name"
              pInputText
              formControlName="name"
              type="text"
              class="w-full"
            />
            <label for="name">Nombre</label>
          </p-floatlabel>
          <app-field-error [control]="form.get('name')" />
        </div>

        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <input
              id="surname"
              pInputText
              formControlName="surname"
              type="text"
              class="w-full"
            />
            <label for="surname">Apellidos</label>
          </p-floatlabel>
          <app-field-error [control]="form.get('surname')" />
        </div>
      </div>

      <p class="text-ecatlim font-bold mt-5 mb-3">Datos de Contacto</p>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
        <p-floatlabel variant="on" class="w-full">
          <input
            id="email"
            pInputText
            formControlName="email"
            type="text"
            class="w-full"
          />
          <label for="email">Correo Electrónico</label>
        </p-floatlabel>

        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <input
              id="phone"
              pInputText
              formControlName="phone"
              type="text"
              class="w-full"
            />
            <label for="phone">Teléfono/móvil</label>
          </p-floatlabel>
          <app-field-error [control]="form.get('phone')" />
        </div>
      </div>

      <p class="text-ecatlim font-bold mt-5 mb-3">Información Personal</p>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <input
              id="census"
              pInputText
              formControlName="census"
              type="number"
              class="w-full"
            />
            <label for="census">Censo en su grupo scout</label>
          </p-floatlabel>
          <app-field-error [control]="form.get('census')" />
        </div>

        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <input
              id="nif"
              pInputText
              formControlName="nif"
              type="text"
              class="w-full"
            />
            <label for="nif">DNI/NIE/Pasaporte</label>
          </p-floatlabel>
          <app-field-error [control]="form.get('nif')" />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 w-full mt-5">
        <div class="w-full md:col-span-2">
          <p-floatlabel variant="on" class="w-full">
            <input
              id="address"
              pInputText
              formControlName="address"
              type="text"
              class="w-full"
            />
            <label for="address">Dirección Postal</label>
          </p-floatlabel>
          <app-field-error [control]="form.get('address')" />
        </div>

        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <input
              id="city"
              pInputText
              formControlName="city"
              type="text"
              class="w-full"
            />
            <label for="city">Municipio</label>
          </p-floatlabel>
          <app-field-error [control]="form.get('city')" />
        </div>

        <div class="w-full">
          <p-floatlabel variant="on" class="w-full">
            <input
              id="country"
              pInputText
              formControlName="country"
              type="text"
              class="w-full"
            />
            <label for="country">País</label>
          </p-floatlabel>
          <app-field-error [control]="form.get('country')" />
        </div>
      </div>
    </div>

    <div class="mt-6 flex justify-end gap-3 w-full">
      <p-button
        label="Actualizar Mis Datos"
        [disabled]="!form.valid"
        [loading]="loading"
        type="submit"
      />
    </div>
  </form>
</p-dialog>
